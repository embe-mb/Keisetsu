# Builds Keisetsu.exe and publishes a GitHub Release with
# Keisetsu-Windows.zip attached, whenever a version tag is pushed:
#   git tag v1.11.1 && git push origin v1.11.1
# The tag must match BUILD_VERSION in keisetsu.py, and the release notes
# come from that build's entry in the CLAUDE.md Build Log.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Check version and write release notes
        run: python .github/release_notes.py "${GITHUB_REF_NAME}" > release_notes.md

      - name: Build Keisetsu.exe
        run: python build_windows.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/Keisetsu-Windows.zip \
            --title "Keisetsu ${GITHUB_REF_NAME#v}" \
            --notes-file release_notes.md
